<!DOCTYPE html>
<html lang="et">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Smash or Pass</title>

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .card {
      background: rgba(30, 41, 59, 0.6);
      backdrop-filter: blur(15px);
      padding: 20px;
      border-radius: 25px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.6);
    }

    h1 {
      text-align: center;
      color: white;
      margin-bottom: 20px;
    }

    .content {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    img {
      width: 320px;
      height: 550px;
      object-fit: cover;
      border-radius: 20px;
      transition: transform 0.3s ease;
      cursor: grab;
    }

    button {
  width: 150px;
  height: 260px;
  border: none;
  border-radius: 25px;
  font-size: 26px;
  font-weight: bold;
  cursor: pointer;
  transition: 0.2s;
}

.pass {
  background: #d1d5db; /* hele hall */
  color: #111827;
}

.smash {
  background: #ec4899; /* roosa */
  color: white;
}

button:hover {
  transform: scale(1.08);
}
    button:hover {
      transform: scale(1.1);
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>Smash or Pass</h1>

    <div class="content">
      <button class="pass" onclick="swipeLeft()">PASS</button>

      <img id="photo">

      <button class="smash" onclick="swipeRight()">SMASH🔥</button>
    </div>
  </div>

  <script>
  const images = [
    { url: "https://i.pinimg.com/736x/14/60/94/1460947fd15187687b8473107f7e57ce.jpg"},
                { url: "https://i.pinimg.com/1200x/99/30/01/993001a8036c6c55d04ef77b5c5c5a77.jpg"},
                  { url: "https://i.pinimg.com/736x/3b/89/7b/3b897b01b0fc7ae3eafe196b143630b1.jpg"},
                  { url: "https://i.pinimg.com/736x/d6/e2/c2/d6e2c2e436bde7d06b82f1f5a2fb9914.jpg"},
                  { url: "https://i.pinimg.com/736x/10/1d/f6/101df662809f4a961ff3ec8bcb1d8384.jpg"},
                  { url: "https://i.pinimg.com/1200x/20/99/32/209932dc566fa6e559217d6d2e240821.jpg"},
                  { url: "https://i.pinimg.com/1200x/d4/89/e4/d489e417d6be5f8164abf117788a7009.jpg"},
                  { url: "https://i.pinimg.com/736x/00/b4/8b/00b48b7a784108d928a606fed8fdc173.jpg"},
                  { url: "https://i.pinimg.com/1200x/42/7e/9b/427e9bdf0e3ee066ef2daaae461c895d.jpg"},
                  { url: "https://i.pinimg.com/736x/c2/cd/c2/c2cdc215f6c27a82b1a1d01f7ab22eda.jpg"},
                  { url: "https://i.pinimg.com/736x/58/00/cd/5800cd3f381bd5e6f9711ce393fffe3b.jpg"}, 
                  { url: "https://i.pinimg.com/736x/73/4d/45/734d45174f8face388bd90081fca6934.jpg"},
                  { url: "https://i.pinimg.com/736x/20/f0/33/20f033ba41c070d1910f45cfcc9faac0.jpg"}, 
                 ];

  let currentIndex = 0;
  const photo = document.getElementById("photo");

  let startX = 0;
  let currentX = 0;
  let isDragging = false;

  function renderPhoto() {
    photo.style.transition = "none";
    photo.style.transform = "translateX(0) rotate(0deg)";
    photo.style.opacity = "0";

    photo.src = images[currentIndex].url;

    setTimeout(() => {
      photo.style.transition = "transform 0.5s ease, opacity 0.3s ease";
      photo.style.opacity = "1";
    }, 50);
  }

  function nextPhoto() {
    currentIndex = (currentIndex + 1) % images.length;
    renderPhoto();
  }

  function swipeRight() {
    photo.style.transform = "translateX(1000px) rotate(30deg)";
    photo.style.opacity = "0";

    setTimeout(() => {
      nextPhoto();
    }, 400);
  }

  function swipeLeft() {
    photo.style.transform = "translateX(-1000px) rotate(-30deg)";
    photo.style.opacity = "0";

    setTimeout(() => {
      nextPhoto();
    }, 400);
  }

  // DRAG
  photo.addEventListener("mousedown", startDrag);
  photo.addEventListener("touchstart", startDrag);

  function startDrag(e) {
    isDragging = true;
    startX = e.touches ? e.touches[0].clientX : e.clientX;
  }

  document.addEventListener("mousemove", drag);
  document.addEventListener("touchmove", drag);

  function drag(e) {
    if (!isDragging) return;

    currentX = e.touches ? e.touches[0].clientX : e.clientX;
    let diff = currentX - startX;

    photo.style.transform = `translateX(${diff}px) rotate(${diff * 0.05}deg)`;
  }

  document.addEventListener("mouseup", endDrag);
  document.addEventListener("touchend", endDrag);

  function endDrag() {
    if (!isDragging) return;
    isDragging = false;

    let diff = currentX - startX;

    if (diff > 120) {
      swipeRight();
    } else if (diff < -120) {
      swipeLeft();
    } else {
      photo.style.transform = "translateX(0)";
    }
  }

  renderPhoto();
</script>
</body>
</html>
