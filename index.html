<!DOCTYPE html>
<html lang="et">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smash or Pass</title>
  <style>
    body {
      margin: 0;
      font-family: Garamond;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .card {
      background: rgba(15, 23, 42, 0.9);
      padding: 20px;
      border-radius: 20px;
      width: 100%;
      max-width: 500px;
      text-align: center;
    }

    img {
      width: 100%;
      height: 800px;
      object-fit: cover;
      border-radius: 15px;
    }

    h1 {
      margin-bottom: 10px;
    }

    .buttons {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .smash {
      background: #22c55e;
      color: white;
    }

    .pass {
      background: #ef4444;
      color: white;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Smash / Pass</h1>
    <img id="photo" src="" alt="Pilt" />
    <h2 id="title"></h2>

    <div class="buttons">
      <button class="smash" onclick="smash()">Smash</button>
      <button class="pass" onclick="passPhoto()">Pass</button>
    </div>
  </div>

  <script>
    const images = [
      { url: "https://i.pinimg.com/736x/14/60/94/1460947fd15187687b8473107f7e57ce.jpg"},
      { url: "https://i.pinimg.com/1200x/99/30/01/993001a8036c6c55d04ef77b5c5c5a77.jpg"},
      { url: "https://i.pinimg.com/736x/3b/89/7b/3b897b01b0fc7ae3eafe196b143630b1.jpg"},
      { url: "https://i.pinimg.com/736x/d6/e2/c2/d6e2c2e436bde7d06b82f1f5a2fb9914.jpg"},
      { url: "https://i.pinimg.com/736x/10/1d/f6/101df662809f4a961ff3ec8bcb1d8384.jpg"},
      { url: "https://i.pinimg.com/1200x/20/99/32/209932dc566fa6e559217d6d2e240821.jpg"},
      { url: "https://i.pinimg.com/1200x/d4/89/e4/d489e417d6be5f8164abf117788a7009.jpg"}, 
      { url: "https://i.pinimg.com/736x/00/b4/8b/00b48b7a784108d928a606fed8fdc173.jpg"},
      { url: "https://i.pinimg.com/1200x/42/7e/9b/427e9bdf0e3ee066ef2daaae461c895d.jpg"},
      { url: "https://i.pinimg.com/736x/c2/cd/c2/c2cdc215f6c27a82b1a1d01f7ab22eda.jpg"},
      { url: "https://i.pinimg.com/736x/58/00/cd/5800cd3f381bd5e6f9711ce393fffe3b.jpg"},
      { url: "https://i.pinimg.com/736x/73/4d/45/734d45174f8face388bd90081fca6934.jpg"},
      { url: "https://i.pinimg.com/736x/20/f0/33/20f033ba41c070d1910f45cfcc9faac0.jpg"},
    ];

    let currentIndex = 0;

    const photo = document.getElementById("photo");
    const title = document.getElementById("title");

    function renderPhoto() {
      const current = images[currentIndex];
      photo.src = current.url;
      title.textContent = current.title;
    }

    function nextPhoto() {
      currentIndex = (currentIndex + 1) % images.length;
      renderPhoto();
    }

    function smash() {
      nextPhoto();
    }

    function passPhoto() {
      nextPhoto();
    }

    renderPhoto();
  </script>
</body>
</html>
