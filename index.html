<!DOCTYPE html>
<html lang="et">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Smash or Pass</title>

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    .card {
      background: rgba(30, 41, 59, 0.6);
      backdrop-filter: blur(15px);
      padding: 20px;
      border-radius: 25px;
      width: 360px;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0,0,0,0.6);
    }

    h1 {
      margin-bottom: 15px;
      color: white;
    }

    .image-container {
      position: relative;
      overflow: hidden;
      border-radius: 20px;
    }

    img {
      width: 100%;
      height: 500px;
      object-fit: cover;
      border-radius: 20px;
      transition: transform 0.3s ease;
      cursor: grab;
    }

    .buttons {
      display: flex;
      justify-content: space-around;
      margin-top: 20px;
    }

    button {
      width: 90px;
      height: 90px;
      border: none;
      border-radius: 50%;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    .pass {
      background: #ef4444;
      color: white;
    }

    .smash {
      background: #22c55e;
      color: white;
    }

    button:hover {
      transform: scale(1.15);
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>Smash or Pass</h1>

    <div class="image-container">
      <img id="photo">
    </div>

    <div class="buttons">
      <button class="pass" onclick="swipeLeft()">PASS</button>
      <button class="smash" onclick="swipeRight()">SMASH</button>
    </div>
  </div>

  <script>
    const images = [
      { url: "https://i.pinimg.com/736x/14/60/94/1460947fd15187687b8473107f7e57ce.jpg"},
      { url: "https://i.pinimg.com/1200x/99/30/01/993001a8036c6c55d04ef77b5c5c5a77.jpg"},
      { url: "https://i.pinimg.com/736x/3b/89/7b/3b897b01b0fc7ae3eafe196b143630b1.jpg"},
      { url: "https://i.pinimg.com/736x/d6/e2/c2/d6e2c2e436bde7d06b82f1f5a2fb9914.jpg"},
      { url: "https://i.pinimg.com/736x/10/1d/f6/101df662809f4a961ff3ec8bcb1d8384.jpg"},
    ];

    let currentIndex = 0;
    const photo = document.getElementById("photo");

    let startX = 0;
    let currentX = 0;
    let isDragging = false;

    function renderPhoto() {
      photo.style.transform = "translateX(0) rotate(0deg)";
      photo.src = images[currentIndex].url;
    }

    function nextPhoto() {
      currentIndex = (currentIndex + 1) % images.length;
      setTimeout(renderPhoto, 200);
    }

    function swipeRight() {
      photo.style.transform = "translateX(500px) rotate(20deg)";
      nextPhoto();
    }

    function swipeLeft() {
      photo.style.transform = "translateX(-500px) rotate(-20deg)";
      nextPhoto();
    }

    // DRAG SWIPE (hiirega + telefoniga)
    photo.addEventListener("mousedown", startDrag);
    photo.addEventListener("touchstart", startDrag);

    function startDrag(e) {
      isDragging = true;
      startX = e.touches ? e.touches[0].clientX : e.clientX;
    }

    document.addEventListener("mousemove", drag);
    document.addEventListener("touchmove", drag);

    function drag(e) {
      if (!isDragging) return;

      currentX = e.touches ? e.touches[0].clientX : e.clientX;
      let diff = currentX - startX;

      photo.style.transform = `translateX(${diff}px) rotate(${diff * 0.05}deg)`;
    }

    document.addEventListener("mouseup", endDrag);
    document.addEventListener("touchend", endDrag);

    function endDrag() {
      if (!isDragging) return;
      isDragging = false;

      let diff = currentX - startX;

      if (diff > 120) {
        swipeRight();
      } else if (diff < -120) {
        swipeLeft();
      } else {
        photo.style.transform = "translateX(0)";
      }
    }

    renderPhoto();
  </script>
</body>
</html>
