<!DOCTYPE html>
<html lang="et">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Smash or Pass</title>

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .card {
      background: rgba(30, 41, 59, 0.6);
      backdrop-filter: blur(15px);
      padding: 20px;
      border-radius: 25px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.6);
    }

    h1 {
      text-align: center;
      color: white;
      margin-bottom: 20px;
    }

    .content {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    img {
      width: 320px;
      height: 550px;
      object-fit: cover;
      border-radius: 20px;
      transition: transform 0.3s ease;
      cursor: grab;
    }

    button {
  width: 150px;
  height: 260px;
  border: none;
  border-radius: 25px;
  font-size: 26px;
  font-weight: bold;
  cursor: pointer;
  transition: 0.2s;
}

.pass {
  background: #d1d5db; /* hele hall */
  color: #111827;
}

.smash {
  background: #ec4899; /* roosa */
  color: white;
}

button:hover {
  transform: scale(1.08);
}
    button:hover {
      transform: scale(1.1);
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>Smash or Pass</h1>

    <div class="content">
      <button class="pass" onclick="swipeLeft()">PASS</button>

      <img id="photo">

      <button class="smash" onclick="swipeRight()">SMASH🔥</button>
    </div>
  </div>

  <script>
  const images = [
    { url: "https://i.pinimg.com/736x/14/60/94/1460947fd15187687b8473107f7e57ce.jpg"},
    { url: "https://i.pinimg.com/1200x/99/30/01/993001a8036c6c55d04ef77b5c5c5a77.jpg"},
    { url: "https://i.pinimg.com/736x/83/dd/40/83dd40f35a81c6a9eed944d1e7f6535f.jpg"},
    { url: "https://i.pinimg.com/736x/3b/89/7b/3b897b01b0fc7ae3eafe196b143630b1.jpg"},
    { url: "https://i.pinimg.com/736x/d6/e2/c2/d6e2c2e436bde7d06b82f1f5a2fb9914.jpg"},
    { url: "https://i.pinimg.com/736x/10/1d/f6/101df662809f4a961ff3ec8bcb1d8384.jpg"},
    { url: "https://i.pinimg.com/736x/29/3f/91/293f914cc1d363bd81753ccd5e21a4d9.jpg"},
    { url: "https://i.pinimg.com/1200x/1e/d3/38/1ed338d9be9c3ae760142549a324a73a.jpg"},
    { url: "https://i.pinimg.com/736x/43/ce/58/43ce58529c2f835d8c6c2f4c7193691f.jpg"},
    { url: "https://i.pinimg.com/736x/c7/ab/14/c7ab14ee0a389afd0bacb9b53cd8fbb1.jpg"},
    { url: "https://i.pinimg.com/736x/7c/e6/d1/7ce6d167022f38de1b6423d8067f4b78.jpg"},
    { url: "https://i.pinimg.com/control1/736x/2d/3e/17/2d3e17fc8367ef6759aabd39b9b240a5.jpg"},
    { url: "https://i.pinimg.com/736x/2f/d9/08/2fd9080c1a891c5016644821f2cf0e75.jpg"},
    { url: "https://i.pinimg.com/736x/09/16/9c/09169c509d3ac0197128fab58c1bf668.jpg"},
    { url: "https://i.pinimg.com/control1/736x/68/2a/38/682a38d1942b50045c9a2bb7e0a9645f.jpg"},
    { url: "https://i.pinimg.com/control1/1200x/40/92/53/409253bad68639d46c9e83a058a92a58.jpg"},
    { url: "https://i.pinimg.com/736x/be/11/06/be11065249e56e6795f4aaf85cb884dc.jpg"},
    { url: "https://i.pinimg.com/1200x/37/ea/3f/37ea3fcf0bef86ce987a34beeacf6ce8.jpg"},
    { url: "https://i.pinimg.com/control1/1200x/fc/8f/9d/fc8f9d212257ce039534f983fe3fe6fc.jpg"},
    { url: "https://i.pinimg.com/1200x/61/6b/da/616bda8d9eee754dd993a42e922c9c2b.jpg"},
    { url: "https://i.pinimg.com/control1/1200x/fc/6c/99/fc6c99c254ad408e65e7c05c40e180a8.jpg"},
    { url: "https://i.pinimg.com/1200x/61/6b/da/616bda8d9eee754dd993a42e922c9c2b.jpg"},
    { url: "https://i.pinimg.com/1200x/20/99/32/209932dc566fa6e559217d6d2e240821.jpg"},
    { url: "https://i.pinimg.com/1200x/d4/89/e4/d489e417d6be5f8164abf117788a7009.jpg"},
    { url: "https://i.pinimg.com/1200x/c1/aa/72/c1aa7297b7cf3804bdefe43f7e0a13ad.jpg"},
    { url: "https://i.pinimg.com/736x/00/b4/8b/00b48b7a784108d928a606fed8fdc173.jpg"},
    { url: "https://i.pinimg.com/736x/37/a9/d3/37a9d3e00d3fd69bbaaaf55cfbba4d40.jpg"},
    { url: "https://i.pinimg.com/1200x/42/7e/9b/427e9bdf0e3ee066ef2daaae461c895d.jpg"},
    { url: "https://i.pinimg.com/736x/1b/5a/06/1b5a06e559ec13ce78e11805a510e4c4.jpg"},
    { url: "https://i.pinimg.com/736x/c2/cd/c2/c2cdc215f6c27a82b1a1d01f7ab22eda.jpg"},
    { url: "https://i.pinimg.com/736x/58/00/cd/5800cd3f381bd5e6f9711ce393fffe3b.jpg"}, 
    { url: "https://i.pinimg.com/1200x/c4/bc/4f/c4bc4f50b8fa4d9636b7d934c4955fbc.jpg"},
    { url: "https://i.pinimg.com/1200x/bb/7a/3d/bb7a3d6e9e8fc2df8f16a9777011fbe2.jpg"},
    { url: "https://i.pinimg.com/736x/73/4d/45/734d45174f8face388bd90081fca6934.jpg"},
    { url: "https://i.pinimg.com/736x/20/f0/33/20f033ba41c070d1910f45cfcc9faac0.jpg"}, 
    { url: "https://i.pinimg.com/736x/51/f1/1c/51f11ca784d1b37252ce283a3f57d45c.jpg"},
    { url: "https://i.pinimg.com/736x/65/8b/99/658b996f919d60fcaca231055d2a01bf.jpg"},
    { url: "https://i.pinimg.com/736x/75/b8/7b/75b87b2fd1414d6ecc831df798abebaa.jpg"},
    { url: "https://i.pinimg.com/736x/7b/76/a8/7b76a8c9a42f31ca39cbe5ade6590428.jpg"},
    { url: "https://i.pinimg.com/736x/ff/94/1a/ff941a9794b6ea24a26473daf2a67953.jpg"}
                 ];

  let currentIndex = 0;
  const photo = document.getElementById("photo");

  let startX = 0;
  let currentX = 0;
  let isDragging = false;

  function renderPhoto() {
    photo.style.transition = "none";
    photo.style.transform = "translateX(0) rotate(0deg)";
    photo.style.opacity = "0";

    photo.src = images[currentIndex].url;

    setTimeout(() => {
      photo.style.transition = "transform 0.5s ease, opacity 0.3s ease";
      photo.style.opacity = "1";
    }, 50);
  }

  function nextPhoto() {
    currentIndex = (currentIndex + 1) % images.length;
    renderPhoto();
  }

  function swipeRight() {
    photo.style.transform = "translateX(1000px) rotate(30deg)";
    photo.style.opacity = "0";

    setTimeout(() => {
      nextPhoto();
    }, 400);
  }

  function swipeLeft() {
    photo.style.transform = "translateX(-1000px) rotate(-30deg)";
    photo.style.opacity = "0";

    setTimeout(() => {
      nextPhoto();
    }, 400);
  }

  // DRAG
  photo.addEventListener("mousedown", startDrag);
  photo.addEventListener("touchstart", startDrag);

  function startDrag(e) {
    isDragging = true;
    startX = e.touches ? e.touches[0].clientX : e.clientX;
  }

  document.addEventListener("mousemove", drag);
  document.addEventListener("touchmove", drag);

  function drag(e) {
    if (!isDragging) return;

    currentX = e.touches ? e.touches[0].clientX : e.clientX;
    let diff = currentX - startX;

    photo.style.transform = `translateX(${diff}px) rotate(${diff * 0.05}deg)`;
  }

  document.addEventListener("mouseup", endDrag);
  document.addEventListener("touchend", endDrag);

  function endDrag() {
    if (!isDragging) return;
    isDragging = false;

    let diff = currentX - startX;

    if (diff > 120) {
      swipeRight();
    } else if (diff < -120) {
      swipeLeft();
    } else {
      photo.style.transform = "translateX(0)";
    }
  }

  renderPhoto();
</script>
  <p style="
  position: fixed;
  bottom: 15px;
  width: 100%;
  text-align: center;
  color: #cbd5f5;
  font-size: 13px;
  opacity: 0.8;
">
  Piltide allikas: Pinterest
</p>
</body>
</html>
