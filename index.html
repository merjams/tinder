<!DOCTYPE html>
<html lang="et">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smash / Pass</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .card {
      background: rgba(15, 23, 42, 0.9);
      padding: 20px;
      border-radius: 20px;
      width: 100%;
      max-width: 500px;
      text-align: center;
    }

    img {
      width: 100%;
      height: 400px;
      object-fit: cover;
      border-radius: 15px;
    }

    h1 {
      margin-bottom: 10px;
    }

    .buttons {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .smash {
      background: #22c55e;
      color: white;
    }

    .pass {
      background: #ef4444;
      color: white;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Smash / Pass</h1>
    <img id="photo" src="" alt="Pilt" />
    <h2 id="title"></h2>

    <div class="buttons">
      <button class="smash" onclick="smash()">Smash</button>
      <button class="pass" onclick="passPhoto()">Pass</button>
    </div>
  </div>

  <script>
    const images = [
      { url: "https://images.unsplash.com/photo-1506744038136-46273834b3fb", title: "Mägi" },
      { url: "https://images.unsplash.com/photo-1517841905240-472988babdf9", title: "Koer" },
      { url: "https://images.unsplash.com/photo-1493246507139-91e8fad9978e", title: "Linn" }
    ];

    let currentIndex = 0;

    const photo = document.getElementById("photo");
    const title = document.getElementById("title");

    function renderPhoto() {
      const current = images[currentIndex];
      photo.src = current.url;
      title.textContent = current.title;
    }

    function nextPhoto() {
      currentIndex = (currentIndex + 1) % images.length;
      renderPhoto();
    }

    function smash() {
      nextPhoto();
    }

    function passPhoto() {
      nextPhoto();
    }

    renderPhoto();
  </script>
</body>
</html>
