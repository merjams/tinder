<!doctype html>
<html>
  <head>
    <base target="_top">
    <title>Juuksevärvi tuvastus</title>
    <script>
      let player = null, c = null, g = null, g2 = null, s1 = null;
      let lastSent = 0; // piirab Sheetsi saatmist

      function start() {
        player = document.getElementById("v1");
        c = document.getElementById("c1");
        g = c.getContext("2d");
        g2 = document.getElementById("c2").getContext("2d");
        s1 = document.getElementById("s1");

        navigator.mediaDevices.getUserMedia({ video: true }).then((stream) => {
          player.srcObject = stream;
        });

        setInterval(capture, 500);
      }

      // arvutab juuksevärvi
      function getHairColor(r, g, b) {
        let avg = (r + g + b) / 3;
        let redDominance = r - (g + b) / 2;
        let maxDiff = Math.max(Math.abs(r - g), Math.abs(r - b), Math.abs(g - b));

        if (avg < 65) return "brünett";
        if (redDominance > 45 && r > 120) return "punapea";
        if (avg > 160 && maxDiff < 50) return "blond";
        if (avg >= 65 && avg <= 160) return "brünett";

        return "muu";
      }

      // saadab värvi Google Sheetsi
      function sendToSheet(color) {
        fetch("https://script.google.com/macros/s/AKfycbwF_JnARb_kuMu8B_4MFQNo5a_IkkA18lCro76VtxuXClo3psKxKfILPlszt1k1zBnD/exec", {
          method: "POST",
          body: JSON.stringify({ color: color }),
          headers: {
            "Content-Type": "application/json"
          }
        });
      }

      
      function capture() {
        g.drawImage(player, 0, 0, c.width, c.height);

        // näo keskkoht (muuda vajadusel)
        let faceX = 110;
        let faceY = 90;
        let faceW = 100;
        let faceH = 100;

        // juukse kast
        let hairW = 30;
        let hairH = 30;
        let hairX = faceX - hairW - 10;
        let hairY = faceY + faceH / 2 - hairH / 2;

        // piirid
        hairX = Math.max(0, hairX);
        hairY = Math.max(0, hairY);
        hairW = Math.min(c.width - hairX, hairW);
        hairH = Math.min(c.height - hairY, hairH);

        g.strokeStyle = "red";
        g.lineWidth = 2;
        g.strokeRect(hairX, hairY, hairW, hairH);

        let d = g.getImageData(hairX, hairY, hairW, hairH);
        g2.putImageData(d, 0, 0);

        let data = d.data;
        let rSum = 0, gSum = 0, bSum = 0;
        let count = 0;

        for (let i = 0; i < data.length; i += 4) {
          let r = data[i], gVal = data[i+1], b = data[i+2];

          // ignoreeri liiga tumedad pikslid
          if (r < 30 && gVal < 30 && b < 30) continue;

          rSum += r;
          gSum += gVal;
          bSum += b;
          count++;
        }

        if (count === 0) return;

        let r = rSum / count;
        let gVal = gSum / count;
        let b = bSum / count;

        let color = getHairColor(r, gVal, b);

        s1.innerHTML = `RGB: ${Math.round(r)}, ${Math.round(gVal)}, ${Math.round(b)} → <b>${color}</b>`;

        // SAADA SHEETSI iga 3 sekundi tagant
        let now = Date.now();
        if (now - lastSent > 3000) {
          sendToSheet(color);
          lastSent = now;
        }
      }
    </script>
  </head>

  <body onload="start()">
    <video id="v1" autoplay style="width: 45%"></video>
    <canvas id="c1" width="320" height="240" style="width: 45%"></canvas><br>
    <canvas id="c2" width="40" height="40"></canvas><br>
    <span id="s1"></span>
  </body>
</html>
